[project]
name = "quotegraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jdk4py>=21.0.8.0",
    "pandas>=2.3.3",
    "pyarrow>=22.0.0",
    "pygtrie>=2.5.0",
    "pyspark>=3.5.7",
    "pyyaml>=6.0.2",
    "tld>=0.13.1",
    "tqdm>=4.67.1",
    "ujson>=5.13.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "ftfy>=6.3.1",
    "sacremoses>=0.1.1",
]


[tool.setuptools]
packages = ["quotegraph", "annotation"]

[tool.setuptools.package-data]
quotegraph = ["merger_patterns.yaml", "merger_prompts/*.txt"]
annotation = ["static/*", "data/batch.jsonl"]

